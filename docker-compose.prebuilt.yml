# Docker Compose override for pre-built frontend
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prebuilt.yml up -d
#
# Before using:
#   1. Build frontend locally: cd QuantDinger-Vue && pnpm build
#   2. Upload QuantDinger-Vue/dist/ to server (rsync or scp)
#   3. Run the command above — no Node/pnpm build happens on server

services:
  frontend:
    # Skip the heavy multi-stage build; use official nginx directly
    image: ${IMAGE_PREFIX:-}nginx:1.25-alpine
    build: null                       # <-- disable the build context from main compose
    container_name: quantdinger-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    depends_on:
      - backend
    networks:
      - quantdinger-network
    environment:
      - NGINX_ENVSUBST_FILTER=BACKEND_URL
      - BACKEND_URL=http://backend:5000
    volumes:
      # Mount your locally-built dist/ folder into nginx web root
      - ./QuantDinger-Vue/dist:/usr/share/nginx/html:ro
      # Mount the nginx config template (envsubst handles ${BACKEND_URL} at start)
      - ./QuantDinger-Vue/deploy/nginx-docker.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
